name: Jinendra-test
version: 1.0.0
schema: v1

models:
  # --- Your New Local Qwen3 Setup ---
  - name: Qwen3 Coder Next (Local)
    provider: lmstudio
    model: qwen3-coder-next
    apiBase: http://localhost:1234/v1
    contextLength: 32768
    roles:
      - chat
      - edit
      - apply
  
  # --- Existing Models ---
  - name: my gpt-5
    provider: openai
    model: gpt-5
    apiKey: YOUR_OPENAI_API_KEY_HERE
  - uses: ollama/qwen2.5-coder-7b
  - uses: anthropic/claude-4-sonnet
    with:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# This enables the "Ghost Text" autocomplete using your local Qwen3
tabAutocompleteModel:
  name: Qwen3 Autocomplete
  provider: lmstudio
  model: qwen3-coder-next
  apiBase: http://localhost:1234/v1

mcpServers:
  - uses: anthropic/memory-mcp