name: ETL Scheduler

on:
  # Schedule disabled — re-enable by uncommenting below
  # schedule:
  #   - cron: '0,30 * * * *'
  # Allow manual trigger from GitHub UI for testing
  workflow_dispatch:

concurrency:
  group: etl-data-pipeline
  cancel-in-progress: false

jobs:
  run-etl:
    name: Run Prediction + Health ETL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      INFLUX_URL: ${{ secrets.INFLUX_URL }}
      INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
      INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
      INFLUX_SKIP_TLS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Prediction ETL
        run: |
          echo "=========================================="
          echo "Starting Prediction ETL — $(date -u)"
          echo "=========================================="
          python scripts/etl/run_prediction_etl.py --level all
          echo "Prediction ETL finished — $(date -u)"

      - name: Run Health Scoring ETL
        run: |
          echo "=========================================="
          echo "Starting Health Scoring ETL — $(date -u)"
          echo "=========================================="
          python scripts/etl/run_health_etl.py --level all --output-hourly
          echo "Health Scoring ETL finished — $(date -u)"

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/health_all_levels.csv data/health_hourly.csv data/healthdb.duckdb
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update ETL outputs [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload ETL outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: etl-outputs-${{ github.run_number }}
          path: |
            data/predictions.csv
            data/health_all_levels.csv
            data/health_hourly.csv
          retention-days: 7
