[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wach-insight"
version = "1.0.0"
description = "Wach Insight Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "E402", "B904"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["F401", "F811"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "backend/venv/",
    "backend/tests/",
    "backend/scripts/",
]
